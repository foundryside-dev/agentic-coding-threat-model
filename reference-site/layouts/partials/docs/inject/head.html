<!-- Inter + JetBrains Mono fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Mermaid.js for diagram rendering -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
  (function() {
    // Hugo Book stores theme preference in localStorage
    var stored = localStorage.getItem('book-theme');
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    var isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
    mermaid.initialize({
      startOnLoad: true,
      theme: isDark ? 'dark' : 'default',
      themeVariables: isDark ? {
        primaryColor: '#2a5570',
        primaryTextColor: '#e0e4e7',
        primaryBorderColor: '#69EBA5',
        lineColor: '#9FA4A7',
        secondaryColor: '#1f3040',
        tertiaryColor: '#24384a'
      } : {
        primaryColor: '#1E3C50',
        primaryTextColor: '#ffffff',
        primaryBorderColor: '#29B480',
        lineColor: '#70767B',
        secondaryColor: '#F4F5F5',
        tertiaryColor: '#CACCCE'
      }
    });

    // Re-render on theme toggle
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function() {
      location.reload();
    });
  })();
</script>
