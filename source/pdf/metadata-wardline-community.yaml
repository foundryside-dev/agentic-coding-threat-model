title: "Wardline: A Classification Framework for Semantic Boundary Protection"
subtitle: "Companion Document to *Semantic Defects in AI-Generated Code*"
author: "John Morrissey"
date: "18 March 2026"
version: "DRAFT v0.1.1"
keywords: "wardline, semantic boundary protection, classification framework, taint analysis, code assurance, AI-generated code"
disclaimer: "This is a draft discussion paper circulated for peer review. It is independent work published in a personal capacity and does not constitute official guidance or policy of any government body. It does not mandate or recommend specific controls for any agency, system, or project. Views and analysis are the author's own."
parent-paper: "Semantic Defects in AI-Generated Code: Assurance Frameworks for AI-Assisted Development in High-Stakes Code Paths (v0.1.0)"
version-table:
  - version: "0.1"
    date: "17 March 2026"
    changes: "Initial release of restructured specification. Language-agnostic classification framework (Part 1) with authority tier model, six-state taint algebra, severity matrix, 17 annotation groups, hierarchical manifest format (wardline.yaml/overlays/JSON registers), SARIF v2.1.0 findings interchange, golden corpus specimen structure, schema defaults for WL-001, control law model (normal/alternate/direct), fingerprint baseline with canonical hashing, 10 conformance criteria. Python language binding (Part 2) with three enforcement layers (AST scanner, type system via Protocols, runtime structural via descriptors), 8 scanner rules mapping to 7 framework rules, and configuration model separating wardline.yaml (trust topology) from wardline.toml (scanner operations). Supersedes prior versions which used a different document structure."
  - version: "0.1.1"
    date: "18 Mar 2026"
    changes: "Quality review pass. Part III practitioner guidance added (§27–37). Spec fixes: Australian English, self-hosting criterion 7, code examples, cross-references. Bidirectional authority collapse paragraph added to §4.1"
