name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install hash-locked MkDocs dependencies
        run: python -m pip install --require-hashes -r .github/legacy-pages-requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: '0.158.0'
          extended: true

      - name: Build Hugo reference site
        working-directory: reference-site
        run: hugo build --minify

      - name: Nest Hugo output into MkDocs site
        run: cp -r reference-site/public/* site/reference/

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.13.0'

      - name: Build Starlight preview
        working-directory: website
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:preview-output
          npm audit --audit-level=high
          npm run build
          npm run test:e2e
          npm run build:preview

      - name: Upload Starlight browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starlight-browser-evidence
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 14

      - name: Nest Starlight preview into MkDocs site
        run: |
          mkdir -p site/preview
          cp -a website/dist/. site/preview/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
